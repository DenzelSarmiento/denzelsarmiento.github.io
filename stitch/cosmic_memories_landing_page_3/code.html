<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Secret Vault Access</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#a413ec",
              "background-light": "#f7f6f8",
              "background-dark": "#1c1022",
              "deep-space": "#0a0510",
              "keypad-bg": "rgba(255, 255, 255, 0.03)",
            },
            fontFamily: {
              "display": ["Plus Jakarta Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'glow': 'glow 3s ease-in-out infinite alternate',
            },
            keyframes: {
              glow: {
                '0%': { boxShadow: '0 0 10px rgba(164, 19, 236, 0.2)' },
                '100%': { boxShadow: '0 0 25px rgba(164, 19, 236, 0.6), 0 0 10px rgba(164, 19, 236, 0.4)' },
              }
            }
          },
        },
      }
    </script>
<style>.space-bg {
        background: radial-gradient(circle at 50% 120%, #2d0b44 0%, #1c1022 40%, #050208 100%);
      }
      .stars {
        background-image: 
          radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
          radial-gradient(1px 1px at 40px 70px, #ffffff, rgba(0,0,0,0)),
          radial-gradient(1px 1px at 50px 160px, #ffffff, rgba(0,0,0,0)),
          radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
          radial-gradient(1px 1px at 130px 80px, #ffffff, rgba(0,0,0,0));
        background-size: 200px 200px;
        opacity: 0.3;
      }.glass-panel {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
      }
      .glass-key {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.2s ease;
      }
      .glass-key:active {
        background: rgba(255, 255, 255, 0.15);
        transform: scale(0.95);
      }::-webkit-scrollbar {
          width: 0px;
          background: transparent;
      }.secure-dots input {
         letter-spacing: 0.5em;
         font-family: 'Material Icons Round'; 
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-dark text-white antialiased overflow-hidden h-screen">
<div class="relative w-full h-full space-bg flex flex-col items-center justify-between overflow-hidden">
<div class="absolute inset-0 stars z-0 pointer-events-none"></div>
<div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
<div class="absolute -top-20 -left-20 w-96 h-96 bg-primary/10 rounded-full blur-[100px] animate-pulse-slow"></div>
<div class="absolute top-1/2 -right-32 w-80 h-80 bg-blue-500/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-full h-64 bg-primary/5 blur-[80px]"></div>
</div>
<header class="relative z-50 w-full px-6 py-8 flex flex-col items-center justify-center gap-2">
<div class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-primary/80 mb-2">
<span class="material-icons-round">lock</span>
</div>
<h1 class="text-xl font-bold text-white tracking-wide text-center">Hidden Constellations</h1>
<p class="text-sm text-white/50 font-light tracking-wider uppercase text-center max-w-[250px]">
            Enter the Secret Key to Reveal Family Messages
        </p>
</header>
<main class="relative z-10 flex-1 w-full max-w-sm px-6 flex flex-col items-center justify-center">
<div class="w-full mb-8 relative group">
<div class="absolute -inset-1 bg-gradient-to-r from-primary/30 to-blue-500/30 rounded-2xl blur opacity-30 group-hover:opacity-60 transition duration-1000 animate-pulse"></div>
<div class="relative w-full h-16 glass-panel rounded-2xl flex items-center justify-center animate-glow">
<div class="flex gap-4">
<div class="w-3 h-3 rounded-full bg-white"></div>
<div class="w-3 h-3 rounded-full bg-white"></div>
<div class="w-3 h-3 rounded-full bg-white"></div>
<div class="w-3 h-3 rounded-full bg-white/20"></div>
</div>
</div>
</div>
<div class="w-full grid grid-cols-3 gap-4 mb-4">
<button class="aspect-square rounded-full glass-key flex items-center justify-center text-2xl font-light hover:bg-white/10">1</button>
<button class="aspect-square rounded-full glass-key flex items-center justify-center text-2xl font-light hover:bg-white/10">2</button>
<button class="aspect-square rounded-full glass-key flex items-center justify-center text-2xl font-light hover:bg-white/10">3</button>
<button class="aspect-square rounded-full glass-key flex items-center justify-center text-2xl font-light hover:bg-white/10">4</button>
<button class="aspect-square rounded-full glass-key flex items-center justify-center text-2xl font-light hover:bg-white/10">5</button>
<button class="aspect-square rounded-full glass-key flex items-center justify-center text-2xl font-light hover:bg-white/10">6</button>
<button class="aspect-square rounded-full glass-key flex items-center justify-center text-2xl font-light hover:bg-white/10">7</button>
<button class="aspect-square rounded-full glass-key flex items-center justify-center text-2xl font-light hover:bg-white/10">8</button>
<button class="aspect-square rounded-full glass-key flex items-center justify-center text-2xl font-light hover:bg-white/10">9</button>
<div class="aspect-square flex items-center justify-center">
<button class="w-full h-full rounded-full flex items-center justify-center text-white/40 hover:text-white transition-colors">
<span class="material-icons-round text-3xl">fingerprint</span>
</button>
</div>
<button class="aspect-square rounded-full glass-key flex items-center justify-center text-2xl font-light hover:bg-white/10">0</button>
<button class="aspect-square rounded-full glass-key flex items-center justify-center text-white hover:bg-red-500/20 transition-colors">
<span class="material-icons-round">backspace</span>
</button>
</div>
</main>
<footer class="relative z-50 w-full p-8 pb-10 flex flex-col items-center justify-center">
<button class="flex items-center gap-2 text-white/40 hover:text-white/80 transition-all text-xs font-medium tracking-widest uppercase hover:gap-3 group">
<span class="material-icons-round text-sm group-hover:-translate-x-1 transition-transform">arrow_back</span>
            Back to Universe
        </button>
</footer>
</div>

</body></html>
