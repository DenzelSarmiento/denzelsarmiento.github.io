<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Memory Star Detail</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&amp;family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#a413ec",
              "background-light": "#f7f6f8",
              "background-dark": "#1c1022",
              "deep-space": "#0a0510",
            },
            fontFamily: {
              "display": ["Plus Jakarta Sans", "sans-serif"],
              "serif": ["Playfair Display", "serif"],
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'float-delayed': 'float 8s ease-in-out infinite 2s',
              'float-slow': 'float 10s ease-in-out infinite 1s',
              'float-reverse': 'float-reverse 12s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'spin-slow': 'spin 20s linear infinite',
              'shimmer': 'shimmer 3s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              'float-reverse': {
                '0%, 100%': { transform: 'translateY(0) translateX(0)' },
                '50%': { transform: 'translateY(20px) translateX(10px)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '200% 0' },
                '100%': { backgroundPosition: '-200% 0' }
              }
            }
          },
        },
      }
    </script>
<style>.space-bg {
        background: radial-gradient(circle at 50% 120%, #2d0b44 0%, #1c1022 40%, #050208 100%);
      }
      .stars {
        background-image: 
          radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
          radial-gradient(1px 1px at 40px 70px, #ffffff, rgba(0,0,0,0)),
          radial-gradient(1px 1px at 50px 160px, #ffffff, rgba(0,0,0,0)),
          radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
          radial-gradient(1px 1px at 130px 80px, #ffffff, rgba(0,0,0,0));
        background-size: 200px 200px;
        opacity: 0.3;
      }.prismatic-bubble {
        position: relative;
        z-index: 10;
        background: transparent;
        border-radius: 9999px;
        box-shadow: 
          0 0 20px rgba(164, 19, 236, 0.3),
          0 0 60px rgba(100, 200, 255, 0.2),
          inset 0 0 30px rgba(255, 255, 255, 0.1);
      }
      .prismatic-bubble::before {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: 9999px;
        padding: 2px;
        background: linear-gradient(45deg, rgba(255,0,0,0.3), rgba(255,154,0,0.3), rgba(208,222,33,0.3), rgba(79,220,74,0.3), rgba(63,218,216,0.3), rgba(47,201,226,0.3), rgba(28,127,238,0.3), rgba(95,21,242,0.3), rgba(186,12,248,0.3), rgba(251,7,217,0.3), rgba(255,0,0,0.3));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0.6;
        animation: spin-slow 10s linear infinite;
        pointer-events: none;
      }.stardust {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
        filter: blur(2px);
      }::-webkit-scrollbar {
          width: 0px;
          background: transparent;
      }
    </style>
<style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-800 dark:text-white antialiased overflow-hidden h-screen selection:bg-primary selection:text-white">
<div class="relative w-full h-full space-bg flex flex-col items-center justify-between overflow-hidden">
<div class="absolute inset-0 stars z-0 pointer-events-none"></div>
<div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
<div class="absolute -top-20 -right-20 w-96 h-96 bg-primary/20 rounded-full blur-[100px] animate-pulse-slow"></div>
<div class="absolute bottom-1/4 -left-32 w-80 h-80 bg-blue-500/10 rounded-full blur-[120px]"></div>
</div>
<div class="stardust w-4 h-4 top-[15%] left-[10%] animate-float opacity-60"></div>
<div class="stardust w-2 h-2 top-[25%] right-[20%] animate-float-delayed opacity-40"></div>
<div class="stardust w-6 h-6 bottom-[30%] left-[15%] animate-float-reverse opacity-30 blur-[4px]"></div>
<div class="stardust w-3 h-3 bottom-[10%] right-[10%] animate-float-slow opacity-50"></div>
<div class="stardust w-1 h-1 top-[40%] left-[5%] animate-float opacity-80"></div>
<div class="stardust w-5 h-5 top-[10%] left-[50%] animate-float-delayed opacity-20 blur-[3px]"></div>
<header class="relative z-50 w-full px-6 py-6 flex justify-end items-start h-20">
<button class="group relative w-10 h-10 flex items-center justify-center transition-transform hover:scale-90 active:scale-75">
<div class="absolute inset-0 bg-white/20 rounded-full blur-md group-hover:bg-white/40 transition-all duration-500 scale-150 group-hover:scale-50 opacity-0 group-hover:opacity-100"></div>
<div class="relative z-10 w-8 h-8 rounded-full border border-white/30 flex items-center justify-center bg-black/20 backdrop-blur-sm group-hover:border-white/60">
<span class="material-icons-round text-white text-lg group-hover:rotate-90 transition-transform duration-500">close</span>
</div>
</button>
</header>
<main class="relative z-10 flex-1 w-full flex flex-col items-center justify-center px-6">
<div class="relative w-72 h-72 md:w-96 md:h-96 mb-8 animate-float">
<div class="absolute -inset-4 bg-gradient-to-tr from-primary/30 to-blue-500/30 rounded-full blur-2xl opacity-50 animate-pulse-slow"></div>
<div class="relative w-full h-full rounded-full prismatic-bubble overflow-hidden border border-white/20">
<img alt="Couple in Paris" class="w-full h-full object-cover opacity-90 hover:opacity-100 hover:scale-110 transition-all duration-[2s] ease-in-out" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD867LgUDUgKjdKDapu1kKqV3M0EgoNJT2pYQDkJl4k9epMBU1wq6jA5PkQfmOdYTtzC7G6KKXSO5ewbe5g1us0BbgzZcF3EFyiTSvmFKzMIDo4awep-3GBsbpleytpUcoX4X6tWBX74V9qZR6yWdCCy0RYessYR-A01gYr9sL46fofWeQWFZRrkfdQ3msU7wdqZn8FRl8P0CR2vpNFpjPH3sx-buZsdJAatUu0XK5JkWh8vBpVo_R22AsxhH5REGj6LX1_1pu3E4p1"/>
<div class="absolute top-4 right-8 w-16 h-8 bg-white/10 rounded-full blur-xl rotate-[-20deg]"></div>
<div class="absolute bottom-8 left-10 w-24 h-24 bg-primary/10 rounded-full blur-2xl"></div>
</div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[120%] h-[120%] border border-white/5 rounded-full animate-spin-slow pointer-events-none">
<div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 w-2 h-2 bg-white rounded-full shadow-[0_0_10px_white]"></div>
</div>
</div>
<div class="relative z-20 max-w-sm text-center space-y-4">
<div class="flex flex-col items-center gap-2">
<span class="text-[10px] font-bold tracking-[0.3em] uppercase text-primary/80">Paris, France</span>
<h1 class="font-serif italic text-3xl md:text-4xl text-white leading-tight">
                    Midnight by the <br/> Seine River
                </h1>
<div class="w-12 h-[1px] bg-gradient-to-r from-transparent via-white/50 to-transparent mt-2 mb-4"></div>
</div>
<p class="font-serif text-white/70 text-base leading-relaxed px-4 md:px-0">
                "The lights reflected on the water like stars fallen to earth. We walked until dawn, promising to return one day."
            </p>
<div class="pt-6 flex justify-center gap-4">
<button class="w-10 h-10 rounded-full border border-white/10 bg-white/5 flex items-center justify-center hover:bg-white/20 transition-colors">
<span class="material-icons-round text-white/80 text-sm">share</span>
</button>
<button class="w-10 h-10 rounded-full border border-white/10 bg-white/5 flex items-center justify-center hover:bg-white/20 transition-colors">
<span class="material-icons-round text-white/80 text-sm">favorite_border</span>
</button>
</div>
</div>
</main>
<footer class="relative z-50 w-full p-8 pb-10 flex flex-col items-center justify-center">
<p class="text-xs font-mono text-white/30 tracking-widest">
            OCTOBER 14, 2023 • 11:42 PM
        </p>
</footer>
</div>

</body></html>
