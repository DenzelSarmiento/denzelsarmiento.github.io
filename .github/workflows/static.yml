name: Deploy Vite to GitHub Pages

on:
  push:
    branches: ["main"] # Cambia a "master" si tu rama principal se llama así

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24 # 👈 Actualizado al estándar de 2026
          
      - name: Install dependencies
        run: npm install
        
      - name: Build project
        run: |
          npx vite build --emptyOutDir # 👈 ¡ESTO OBLIGA A LIMPIAR TODO LO VIEJO!

        
      - name: Build project
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v5 # 👈 Forzar versión limpia de configuración
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          retention-days: 1 # 👈 Obliga a GitHub a borrar el caché viejo de producción
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

