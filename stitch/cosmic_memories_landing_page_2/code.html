<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dynamic Orbital Universe</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#b347ea",
              "secondary": "#5e17eb",
              "background-dark": "#0d0415",
              "deep-space": "#05010a",
              "orbit": "rgba(255, 255, 255, 0.08)",
            },
            fontFamily: {
              "display": ["Plus Jakarta Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'float-delayed': 'float 8s ease-in-out infinite 2s',
              'float-slow': 'float 10s ease-in-out infinite 1s',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'spin-slow': 'spin 30s linear infinite',
              'spin-reverse-slow': 'spin 40s linear infinite reverse',
              'orbit-move': 'orbit 20s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              orbit: {
                '0%': { transform: 'rotate(0deg)' },
                '100%': { transform: 'rotate(360deg)' },
              }
            }
          },
        },
      }
    </script>
<style>.nebula-bg {
        background: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #0d0415 50%, #000000 100%);
      }
      .stars {
        background-image: 
          radial-gradient(1.5px 1.5px at 20px 30px, #ffffff, rgba(0,0,0,0)),
          radial-gradient(1.5px 1.5px at 40px 70px, #a413ec, rgba(0,0,0,0)),
          radial-gradient(1px 1px at 50px 160px, #ffffff, rgba(0,0,0,0)),
          radial-gradient(1.5px 1.5px at 90px 40px, #5e17eb, rgba(0,0,0,0)),
          radial-gradient(1px 1px at 130px 80px, #ffffff, rgba(0,0,0,0));
        background-size: 250px 250px;
        opacity: 0.6;
      }.glass-bubble {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
      }
      .planet-body {
        background: radial-gradient(circle at 30% 30%, #2a2a2a 0%, #000000 70%);
        box-shadow: 
          inset -10px -10px 40px rgba(0,0,0,1),
          0 0 60px rgba(94, 23, 235, 0.2);
      }.orbital-ring {
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 50%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }.motion-trail {
        background: linear-gradient(90deg, rgba(164,19,236,0) 0%, rgba(164,19,236,0.4) 100%);
        filter: blur(4px);
        border-radius: 999px;
      }::-webkit-scrollbar {
          width: 0px;
          background: transparent;
      }
    </style>
<style>
        body {
          min-height: max(800px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-dark text-white antialiased overflow-hidden h-screen selection:bg-primary selection:text-white">
<div class="relative w-full h-full nebula-bg flex flex-col items-center justify-between overflow-hidden">
<div class="absolute inset-0 stars z-0 pointer-events-none animate-pulse-slow"></div>
<div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
<div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-secondary/10 rounded-full blur-[120px] mix-blend-screen"></div>
<div class="absolute bottom-1/4 right-1/4 w-[400px] h-[400px] bg-primary/10 rounded-full blur-[100px] mix-blend-screen"></div>
</div>
<header class="relative z-50 w-full px-6 py-8 flex justify-between items-start">
<button class="w-10 h-10 rounded-full glass-bubble flex items-center justify-center text-white/80 hover:bg-white/10 transition-colors backdrop-blur-md">
<span class="material-icons-round text-lg">grid_view</span>
</button>
<div class="flex flex-col items-center pt-2">
<h1 class="text-sm font-light tracking-[0.3em] text-white/90 uppercase">Universe</h1>
<div class="w-1 h-1 rounded-full bg-primary mt-2"></div>
</div>
<button class="w-10 h-10 rounded-full glass-bubble flex items-center justify-center text-white/80 hover:bg-white/10 transition-colors backdrop-blur-md">
<span class="material-icons-round text-lg">search</span>
</button>
</header>
<main class="relative z-10 flex-1 w-full flex items-center justify-center perspective-1000">
<div class="relative flex items-center justify-center">
<div class="orbital-ring w-[650px] h-[650px] border-white/5 animate-spin-slow">
<div class="absolute top-[15%] right-[15%] w-24 h-24 -rotate-45">
<div class="absolute top-1/2 -left-16 w-20 h-2 bg-gradient-to-r from-transparent to-primary/30 blur-md rotate-[-15deg]"></div>
<div class="glass-bubble w-full h-full rounded-full flex flex-col items-center justify-center p-2 text-center transform hover:scale-110 transition-transform duration-500 cursor-pointer group">
<span class="text-xs text-white/60 mb-1">2021</span>
<span class="text-sm font-semibold text-white">Paris</span>
<span class="material-icons-round text-primary/80 text-sm mt-1">flight</span>
</div>
</div>
</div>
<div class="orbital-ring w-[450px] h-[450px] border-white/10 animate-spin-reverse-slow">
<div class="absolute bottom-[20%] left-[10%] w-auto h-auto">
<div class="glass-bubble px-5 py-3 rounded-full flex items-center gap-3 transform hover:scale-105 transition-transform duration-300 cursor-pointer">
<span class="material-icons-round text-pink-400 text-sm">favorite</span>
<div class="flex flex-col">
<span class="text-xs font-bold text-white whitespace-nowrap">First Kiss</span>
<span class="text-[9px] text-white/50">Dec 14</span>
</div>
</div>
</div>
<div class="absolute top-[10%] right-[30%] w-3 h-3 rounded-full bg-white/40 shadow-[0_0_10px_rgba(255,255,255,0.5)]"></div>
</div>
<div class="orbital-ring w-[280px] h-[280px] border-white/15 animate-spin-slow">
<div class="absolute top-[50%] -left-[6%] w-14 h-14">
<div class="glass-bubble w-full h-full rounded-full flex items-center justify-center transform hover:scale-110 transition-transform duration-300 cursor-pointer border-primary/30">
<span class="text-lg">🎓</span>
</div>
</div>
</div>
<div class="relative w-32 h-32 z-20">
<div class="absolute inset-0 rounded-full planet-body"></div>
<div class="absolute -inset-4 rounded-full bg-primary/20 blur-xl animate-pulse-slow"></div>
<div class="absolute -inset-1 rounded-full border border-primary/20 opacity-50"></div>
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-1 h-1 rounded-full bg-white animate-ping"></div>
</div>
</div>
<div class="absolute top-[-150px] right-[-40px] animate-float-delayed z-30">
<div class="glass-bubble px-4 py-2 rounded-full flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
<span class="text-[10px] font-medium tracking-wide">ACTIVE MEMORY</span>
</div>
</div>
</div>
</main>
<footer class="relative z-50 w-full px-8 pb-10 pt-4 flex justify-center items-end">
<div class="glass-bubble px-1 p-1 rounded-full flex items-center gap-1 backdrop-blur-xl">
<button class="w-12 h-12 rounded-full hover:bg-white/10 flex items-center justify-center text-white/50 hover:text-white transition-all">
<span class="material-icons-round text-xl">history</span>
</button>
<button class="w-14 h-14 rounded-full bg-white text-black flex items-center justify-center shadow-[0_0_20px_rgba(255,255,255,0.3)] hover:scale-105 transition-transform">
<span class="material-icons-round text-2xl">add</span>
</button>
<button class="w-12 h-12 rounded-full hover:bg-white/10 flex items-center justify-center text-white/50 hover:text-white transition-all">
<span class="material-icons-round text-xl">auto_awesome</span>
</button>
</div>
</footer>
</div>

</body></html>
