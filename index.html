<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuestro Baul</title>
  <meta name="description" content="Un jardín personal de nuestros recuerdos por el 21 de septiembre." />
  
  <!-- Tailwind v3 Engine -->
  <script src="https://tailwindcss.com"></script>

  <!-- Hojas de estilo forzadas con alias e inmunidad de CORS -->
  <link rel="stylesheet" href="https://googleapis.com" />
  <link rel="stylesheet" href="https://googleapis.com" />
  <link rel="stylesheet" href="https://googleapis.com" />

  <!-- Script Interceptor: Corrige el error de CORS de Vite en tiempo real -->
  <script>
    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        mutation.addedNodes.forEach((node) => {
          if (node.tagName === 'LINK' && node.href.includes('googleapis.com/')) {
            if (!node.href.includes('fonts.googleapis.com')) {
              console.log('Parcheando ruta rota de Vite:', node.href);
              node.href = 'https://googleapis.com';
            }
          }
        });
      });
    });
    observer.observe(document.head, { childList: true });
  </script>

  <link rel="icon" href="data:;base64,=">
</head>
<body class="bg-slate-950 text-slate-100 overflow-x-hidden">
  <div id="app"></div>
  
  <script type="module" src="./src/main.js"></script>
</body>
</html>
